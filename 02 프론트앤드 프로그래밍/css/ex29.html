<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">

    </head>
    <body>

        <style>
            ul {
                list-style: none;
                margin: 0;
                padding: 0;
                height: 100px;
                display: flex;
                background: #ccc;

            }
            li {
                width: 100px;
            }
            li:nth-of-type(1){
                background: red;
            }
            li:nth-of-type(2){
                background: gold;
            }
            li:nth-of-type(3){
                background: green;
            }
            .flex1{
               align-items: stretch;
            }
            .flex2 {
                align-items: start;
            }
            .flex3 {
                align-items: end;
            }
            .flex4 {
                align-items: center;
            }

  
        </style>
        <h2>aling-items:stretch</h2>
        <ul class="flex1">
            <li>메뉴1</li>
            <li>메뉴2</li>
            <li>메뉴3</li>
        </ul>
        <h2>aling-items:start</h2>
        <ul class="flex2">
            <li>메뉴1</li>
            <li>메뉴2</li>
            <li>메뉴3</li>
        </ul>
        <h2>aling-items:end</h2>
        <ul class="flex3">
            <li>메뉴1</li>
            <li>메뉴2</li>
            <li>메뉴3</li>
        </ul>
        <h2>aling-items:center</h2>
        <ul class="flex4">
            <li>메뉴1</li>
            <li>메뉴2</li>
            <li>메뉴3</li>
        </ul>
    </body>
</html>
