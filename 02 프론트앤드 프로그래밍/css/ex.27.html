<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">

    </head>
    <body>

        <style>
            ul {
                list-style: none;
                margin: 0;
                padding: 0;
                height: 100px;
                display: flex;
                background: #ccc;
            }
            li {
                width: 100px;
            }
            li:nth-of-type(1){
                background: red;
            }
            li:nth-of-type(2){
                background: gold;
            }
            li:nth-of-type(3){
                background: green;
            }
            .flex1{
                flex-direction: row;
            }
            .flex2 {
                flex-direction: column;
            }
            .flex3 {
                flex-direction: column-reverse;
            }
  
        </style>
        <ul class="flex">
            <li>메뉴1</li>
            <li>메뉴2</li>
            <li>메뉴3</li>
        </ul>
        <h1>flex-directoion: row</h1>
        <ul class="flex1">
            <li>메뉴1</li>
            <li>메뉴2</li>
            <li>메뉴3</li>
        </ul>
        <h1>flex-directoion: reverse</h1>
        <ul class="flex2">
            <li>메뉴1</li>
            <li>메뉴2</li>
            <li>메뉴3</li>
        </ul>
        <h1>flex-column: reverse</h1>
        <ul class="flex2">
            <li>메뉴1</li>
            <li>메뉴2</li>
            <li>메뉴3</li>
        </ul>
        <h1>flex-column-reverse: reverse</h1>
        <ul class="flex2">
            <li>메뉴1</li>
            <li>메뉴2</li>
            <li>메뉴3</li>
        </ul>
    </body>
</html>
