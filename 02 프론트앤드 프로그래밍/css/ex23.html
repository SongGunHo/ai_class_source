<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">

    </head>
    <body>

        <style>
            boby {
                height: 2000px;
            }
            @media screen and (max-width: 1000px) {
                html {
                    background: gray;
                }
            }
            @media screen and (max-width: 700px){
                html {
                    background: navy;
                }
            }
            @media screen and (max-width: 300px){
                html {
                    background: red;
                }
            }

            @media screen and (min-width: 1000px){
                html {
                    background: orange;
                }
            }
            @media print {
                html {
                    background: gold;
                }
            }
            
                
        </style>
    </body>
</html>
